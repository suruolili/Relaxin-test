name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1


    steps:


    # =====================
    # Checkout
    # =====================

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false



    # =====================
    # Install dependencies
    # =====================

    - name: Install build tools
      run: |

        echo "===== Install tools ====="


        brew install \
          ldid \
          dpkg \
          ripgrep \
          fakeroot \
          coreutils \
          binutils \
          gnu-tar


        echo "===== PATH ====="

        echo $PATH


        echo "===== Tools ====="


        which ldid
        which dpkg-deb
        which rg
        which fakeroot
        which ar
        which tar




    # =====================
    # Check trustcache
    # =====================

    - name: Check trustcache
      run: |

        echo "===== Searching trustcache ====="


        if [ ! -f Tools/trustcache ]; then

          echo "ERROR: trustcache missing"

          echo ""

          echo "Please add executable file:"

          echo "Tools/trustcache"

          echo ""

          find . -iname "*trustcache*" || true

          exit 1

        fi



        chmod +x Tools/trustcache



        echo "===== trustcache info ====="


        ls -lh Tools/trustcache


        file Tools/trustcache



        echo "===== trustcache test ====="


        Tools/trustcache --help || true




    # =====================
    # Fix permissions
    # =====================

    - name: Fix permissions
      run: |


        echo "===== Fix scripts ====="



        find DevKit \
        -name "*.sh" \
        -exec chmod +x {} \;



        chmod +x DevKit/Helpers/*.sh || true



        chmod +x Tools/trustcache




        echo "Permissions fixed"




    # =====================
    # Environment check
    # =====================

    - name: Verify environment
      run: |


        echo "===== Environment ====="


        echo $PATH



        echo "===== Tools ====="


        which ldid

        which dpkg-deb

        which rg


        echo "===== trustcache ====="


        ls -l Tools/trustcache




    # =====================
    # Debug BaseBin
    # =====================

    - name: Debug BaseBin
      run: |


        echo "===== BaseBin tree ====="


        find Vendor/Dopamine/BaseBin \
        -maxdepth 3 \
        -type f | head -100 || true



        echo ""

        echo "===== trustcache references ====="


        grep -R "trustcache" \
        Vendor/Dopamine/BaseBin \
        || true




    # =====================
    # Build
    # =====================

    - name: Build Relaxin TIPA
      run: |


        set -o pipefail


        export PATH="$PATH:$PWD/Tools"


        echo "PATH=$PATH"


        echo "===== Start build ====="



        make tipa V=1 2>&1 | tee build.log




    # =====================
    # Upload log
    # =====================

    - name: Upload build log
      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-build-log

        path: build.log




    # =====================
    # Find TIPA
    # =====================

    - name: Find TIPA
      if: always()

      run: |


        echo "===== Searching TIPA ====="


        find . \
        -name "*.tipa" \
        -print || true




    # =====================
    # Upload TIPA
    # =====================

    - name: Upload TIPA
      if: success()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-tipa

        path: |
          **/*.tipa
