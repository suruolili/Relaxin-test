name: Build Relaxin TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TIPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew update
          brew install ldid

      - name: Fix script permissions
        run: |
          find DevKit -type f -name "*.sh" -exec chmod +x {} \;

      - name: Check build tools
        run: |
          echo "=== clang ==="
          clang --version

          echo "=== make ==="
          make --version

          echo "=== ldid ==="
          which ldid
          ldid -h || true

      - name: Build TIPA
        run: |
          make tipa

      - name: Find TIPA
        id: find_tipa
        run: |
          echo "Searching for generated TIPA..."

          find . -type f -name "*.tipa" -print

          TIPA=$(find . -type f -name "*.tipa" | head -n 1)

          if [ -z "$TIPA" ]; then
            echo "ERROR: No .tipa file was generated."
            exit 1
          fi

          echo "Found TIPA:"
          echo "$TIPA"

          echo "tipa=$TIPA" >> "$GITHUB_OUTPUT"

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-TIPA
          path: ${{ steps.find_tipa.outputs.tipa }}
          if-no-files-found: error
          retention-days: 30