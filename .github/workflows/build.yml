name: Build Relaxin TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:
  build:

    runs-on: macos-latest

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1


    steps:

    # 下载源码
    - name: Checkout
      uses: actions/checkout@v4



    # 安装编译依赖
    - name: Install build tools
      run: |
        brew install \
          ldid \
          dpkg \
          ripgrep \
          fakeroot \
          coreutils


        echo "===== Installed tools ====="

        which ldid
        which dpkg-deb
        which rg
        which fakeroot



    # 安装 trustcache
    - name: Install trustcache
      run: |

        echo "Building trustcache..."

        git clone https://github.com/ProcursusTeam/trustcache.git /tmp/trustcache


        cd /tmp/trustcache


        make


        sudo install -m 755 trustcache /usr/local/bin/trustcache


        echo "===== Check trustcache ====="

        which trustcache

        trustcache --help || true



    # 修复执行权限
    - name: Fix permissions
      run: |

        find DevKit -name "*.sh" -exec chmod +x {} \;


        chmod +x DevKit/Helpers/*.sh || true


        ls -la DevKit/Helpers



    # 编译
    - name: Build Relaxin TIPA
      run: |

        set -o pipefail

        make tipa 2>&1 | tee build.log



    # 查找生成文件
    - name: Find TIPA
      if: always()
      run: |

        find . -name "*.tipa" || true



    # 上传日志
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:

        name: Relaxin-build-log

        path: build.log



    # 上传 TIPA
    - name: Upload TIPA
      if: success()
      uses: actions/upload-artifact@v4
      with:

        name: Relaxin-tipa

        path: |
          **/*.tipa
