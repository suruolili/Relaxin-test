name: Build Relaxin TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TIPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix script permissions
        run: |
          chmod +x DevKit/Helpers/check-tools.sh
          find DevKit -type f -name "*.sh" -exec chmod +x {} \;

      - name: Show environment
        run: |
          echo "macOS:"
          sw_vers
          echo "Xcode:"
          xcodebuild -version
          echo "Architecture:"
          uname -m
          echo "Repository:"
          pwd

      - name: Build TIPA
        run: |
          make tipa

      - name: Find TIPA
        id: find_tipa
        run: |
          echo "Searching for TIPA files..."

          find . -type f -name "*.tipa" -print

          TIPA=$(find . -type f -name "*.tipa" | head -n 1)

          if [ -z "$TIPA" ]; then
            echo "ERROR: No .tipa file was generated."
            exit 1
          fi

          echo "Found: $TIPA"
          echo "tipa=$TIPA" >> "$GITHUB_OUTPUT"

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-TIPA
          path: ${{ steps.find_tipa.outputs.tipa }}
          if-no-files-found: error
          retention-days: 30