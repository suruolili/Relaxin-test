name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1


    steps:


      # =========================
      # Checkout
      # =========================

      - name: Checkout
        uses: actions/checkout@v4



      # =========================
      # Install dependencies
      # =========================

      - name: Install build tools
        run: |

          echo "===== Install tools ====="


          brew install \
            ldid \
            dpkg \
            ripgrep \
            fakeroot \
            coreutils \
            gnu-tar \
            binutils



          echo "/opt/homebrew/opt/binutils/bin" >> $GITHUB_PATH

          echo "/opt/homebrew/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH



          echo "===== Verify tools ====="


          which ldid

          which dpkg-deb

          which rg

          which fakeroot

          which ar

          which tar





      # =========================
      # Install trustcache
      # =========================
      # =========================
      # Install trustcache
      # =========================

      - name: Install trustcache
        run: |

          echo "===== Searching trustcache ====="


          TRUSTCACHE_PATH=""


          # 搜索源码仓库
          if [ -f "./trustcache" ]; then
              TRUSTCACHE_PATH="./trustcache"
          fi


          if [ -f "./Tools/trustcache" ]; then
              TRUSTCACHE_PATH="./Tools/trustcache"
          fi


          if [ -f "./DevKit/trustcache" ]; then
              TRUSTCACHE_PATH="./DevKit/trustcache"
          fi



          # 搜索已有环境
          if [ -z "$TRUSTCACHE_PATH" ]; then

              EXISTING=$(which trustcache || true)

              if [ -n "$EXISTING" ]; then
                  TRUSTCACHE_PATH="$EXISTING"
              fi

          fi



          if [ -z "$TRUSTCACHE_PATH" ]; then

              echo "ERROR: trustcache not found"

              echo "Please add trustcache binary to:"
              echo "Tools/trustcache"

              exit 1

          fi



          echo "Using:"
          echo "$TRUSTCACHE_PATH"



          chmod +x "$TRUSTCACHE_PATH"



          sudo install \
          -m 755 \
          "$TRUSTCACHE_PATH" \
          /usr/local/bin/trustcache



          echo "===== Verify ====="


          which trustcache


          trustcache --help || true

      # =========================
      # Fix permissions
      # =========================

      - name: Fix permissions
        run: |


          echo "===== Fix scripts ====="



          find DevKit \
          -name "*.sh" \
          -exec chmod +x {} \;



          chmod +x DevKit/Helpers/*.sh || true



          ls -la DevKit/Helpers





      # =========================
      # Environment check
      # =========================

      - name: Verify environment
        run: |


          echo "===== PATH ====="

          echo $PATH



          echo "===== Tools ====="



          which ldid


          which dpkg-deb


          which rg


          which trustcache



          ldid -h || true


          dpkg-deb --version


          trustcache --help || true





      # =========================
      # Debug BaseBin
      # =========================

      - name: Debug BaseBin
        run: |


          echo "===== BaseBin files ====="



          find . \
          \( \
          -iname "*basebin*" \
          -o \
          -iname "*trustcache*" \
          \)



          echo "===== trustcache reference ====="



          grep -R "trustcache" . || true





      # =========================
      # Build
      # =========================

      - name: Build Relaxin TIPA
        run: |


          set -o pipefail



          export V=1

          export VERBOSE=1



          make tipa V=1 VERBOSE=1 2>&1 | tee build.log





      # =========================
      # Upload log
      # =========================

      - name: Upload build log
        if: always()

        uses: actions/upload-artifact@v4


        with:


          name: Relaxin-build-log


          path: build.log





      # =========================
      # Find tipa
      # =========================

      - name: Find TIPA
        if: always()

        run: |


          find . -name "*.tipa" || true





      # =========================
      # Upload tipa
      # =========================

      - name: Upload TIPA
        if: success()

        uses: actions/upload-artifact@v4


        with:


          name: Relaxin-tipa


          path: |
            **/*.tipa
