name: Build Relaxin TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install build tools
      run: |
        brew update
        brew install ldid ripgrep


    - name: Fix permissions
      run: |
        chmod +x DevKit/Helpers/*.sh


    - name: Build TIPA
      run: |
        make tipa


    - name: Find TIPA
      run: |
        find . -name "*.tipa"


    - name: Upload TIPA
      uses: actions/upload-artifact@v4
      with:
        name: Relaxin-tipa
        path: "**/*.tipa"
