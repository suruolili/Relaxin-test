name: Build Relaxin TIPA

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Build tipa
        run: |
          chmod +x DevKit/Helpers/check-tools.sh
          make tipa

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-tipa
          path: |
            *.tipa
            build/*.tipa
            packages/*.tipa
