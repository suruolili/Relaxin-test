name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1


    steps:


    # =====================
    # Checkout
    # =====================

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # =====================
    # Install dependencies
    # =====================

    - name: Install build tools
      run: |

        brew install \
          ldid \
          dpkg \
          ripgrep \
          fakeroot \
          coreutils


        echo "===== Installed ====="

        which ldid
        which dpkg-deb
        which rg
        which fakeroot



    # =====================
    # Check trustcache
    # =====================

     - name: Build trustcache
  run: |

    echo "===== Building trustcache ====="


    mkdir -p Tools


    git clone --depth=1 \
      https://github.com/ProcursusTeam/trustcache.git \
      /tmp/trustcache



    cd /tmp/trustcache


    make



    cp trustcache \
    $GITHUB_WORKSPACE/Tools/trustcache



    chmod +x \
    $GITHUB_WORKSPACE/Tools/trustcache



    echo "===== Verify ====="


    file \
    $GITHUB_WORKSPACE/Tools/trustcache


    ls -lh \
    $GITHUB_WORKSPACE/Tools/trustcache

        echo "===== Searching trustcache ====="


        if [ ! -f Tools/trustcache ]; then

          echo "ERROR: trustcache missing"

          echo "Please add executable file:"

          echo "Tools/trustcache"

          exit 1

        fi



        chmod +x Tools/trustcache



        echo "===== trustcache ====="


        ls -lh Tools/trustcache


        file Tools/trustcache





    # =====================
    # Fix permissions
    # =====================

    - name: Fix permissions
      run: |


        chmod +x Tools/trustcache



        find DevKit \
        -name "*.sh" \
        -exec chmod +x {} \;



        chmod +x DevKit/Helpers/*.sh || true



        echo "===== Permissions OK ====="





    # =====================
    # Environment
    # =====================

    - name: Verify environment
      run: |


        echo "PATH=$PATH"


        which ldid

        which dpkg-deb

        which rg



        echo "trustcache:"

        ls -l Tools/trustcache





    # =====================
    # Debug BaseBin
    # =====================

    - name: Debug BaseBin
      run: |


        echo "===== BaseBin ====="


        find Vendor/Dopamine/BaseBin -maxdepth 2 -type d || true



        echo "===== trustcache references ====="


        grep -R "trustcache" Vendor/Dopamine/BaseBin || true





    # =====================
    # Build
    # =====================

    - name: Build Relaxin TIPA
      run: |


        set -o pipefail


        make tipa V=1 2>&1 | tee build.log





    # =====================
    # Upload log
    # =====================

    - name: Upload build log
      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-build-log

        path: build.log





    # =====================
    # Find TIPA
    # =====================

    - name: Find TIPA
      if: always()

      run: |

        find . -name "*.tipa" || true





    # =====================
    # Upload TIPA
    # =====================

    - name: Upload TIPA
      if: success()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-tipa

        path: |
          **/*.tipa
