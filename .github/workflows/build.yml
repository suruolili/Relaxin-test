name: Build Relaxin TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:
  build:

    runs-on: macos-latest

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1


    steps:


    # 下载源码
    - name: Checkout
      uses: actions/checkout@v4



    # 安装编译依赖
    - name: Install build tools
      run: |
        brew install \
          ldid \
          dpkg \
          ripgrep \
          fakeroot \
          coreutils


        echo "===== Installed tools ====="

        which ldid
        which dpkg-deb
        which rg
        which fakeroot



    # 安装 Relaxin 所需工具
    - name: Prepare trustcache tool
      run: |

        echo "Searching trustcache requirement..."

        grep -R "trustcache" . || true


        echo "Current PATH:"
        echo $PATH


        echo "Checking trustcache..."

        if command -v trustcache >/dev/null 2>&1
        then
          trustcache --help || true
        else
          echo "trustcache not installed"
        fi



    # 修复脚本权限
    - name: Fix permissions
      run: |

        find DevKit -name "*.sh" -exec chmod +x {} \;

        chmod +x DevKit/Helpers/*.sh || true

        ls -la DevKit/Helpers



    # 编译 Relaxin
    - name: Build Relaxin TIPA
      run: |

        set -o pipefail

        make tipa 2>&1 | tee build.log



    # 查找 tipa
    - name: Find TIPA
      if: always()
      run: |

        find . -name "*.tipa" || true



    # 上传日志
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:

        name: Relaxin-build-log

        path: build.log



    # 上传 TIPA
    - name: Upload TIPA
      if: success()
      uses: actions/upload-artifact@v4
      with:

        name: Relaxin-tipa

        path: |
          **/*.tipa
