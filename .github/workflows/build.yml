name: Build Relaxin TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Relaxin
    runs-on: macos-14

    steps:
      # ==========================================
      # 1. 获取源码
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ==========================================
      # 2. 安装 Homebrew 依赖
      # ==========================================
      - name: Install dependencies
        run: |
          brew update

          brew install make || true
          brew install ldid || true
          brew install xz || true
          brew install zstd || true

      # ==========================================
      # 3. 安装 RootHide Theos
      # ==========================================
      - name: Install Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive \
              https://github.com/RootHide/Theos.git \
              "$HOME/theos"
          fi

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      # ==========================================
      # 4. 配置 PATH
      # ==========================================
      - name: Configure environment
        run: |
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/theos/bin:$PATH"

          echo "===== Theos ====="
          ls -la "$HOME/theos"

          echo "===== Versions ====="
          make --version
          xcodebuild -version
          clang --version

      # ==========================================
      # 5. 检查项目结构
      # ==========================================
      - name: Inspect project
        run: |
          echo "===== ROOT ====="
          ls -la

          echo ""
          echo "===== Makefiles ====="
          find . -maxdepth 3 \
            -iname "Makefile" \
            -print

          echo ""
          echo "===== Build scripts ====="
          find . -maxdepth 2 \
            -type f \
            \( -name "*.sh" -o -name "*.mk" \) \
            -print

      # ==========================================
      # 6. 设置脚本权限
      # ==========================================
      - name: Prepare scripts
        run: |
          find . -type f -name "*.sh" -exec chmod +x {} \; || true

      # ==========================================
      # 7. 清理旧构建
      # ==========================================
      - name: Clean
        run: |
          make clean || true

          rm -rf packages
          rm -rf build

      # ==========================================
      # 8. 编译
      # ==========================================
      - name: Build package
        shell: bash
        run: |
          set -o pipefail

          echo "===== Building Relaxin ====="

          make package \
            FINALPACKAGE=1 \
            2>&1 | tee build.log

      # ==========================================
      # 9. 查找生成文件
      # ==========================================
      - name: Find package
        id: package
        shell: bash
        run: |
          echo "===== Searching packages ====="

          find . \
            -type f \
            \( \
              -name "*.tipa" \
              -o -name "*.ipa" \
            \) \
            -print

          FILE=""

          # 优先 packages
          if [ -d "packages" ]; then
            FILE=$(find packages \
              -type f \
              \( -name "*.tipa" -o -name "*.ipa" \) \
              -print -quit)
          fi

          # 再搜索整个仓库
          if [ -z "$FILE" ]; then
            FILE=$(find . \
              -type f \
              \( -name "*.tipa" -o -name "*.ipa" \) \
              -print -quit)
          fi

          if [ -z "$FILE" ]; then
            echo ""
            echo "ERROR: No TIPA/IPA was generated."
            echo ""
            echo "===== BUILD LOG ====="
            cat build.log || true
            exit 1
          fi

          echo ""
          echo "Found package:"
          echo "$FILE"

          mkdir -p release

          cp "$FILE" release/Relaxin.tipa

          echo "PACKAGE=$FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 10. 检查 TIPA
      # ==========================================
      - name: Verify TIPA
        run: |
          echo "===== Release file ====="
          ls -lh release/Relaxin.tipa

          echo ""
          echo "===== File type ====="
          file release/Relaxin.tipa

      # ==========================================
      # 11. 上传 Actions Artifact
      # ==========================================
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-TIPA
          path: release/Relaxin.tipa
          if-no-files-found: error

      # ==========================================
      # 12. 生成 Release Tag
      # ==========================================
      - name: Generate tag
        id: release
        shell: bash
        run: |
          TAG="v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"

          echo "TAG=$TAG" >> "$GITHUB_ENV"

          echo "Release tag:"
          echo "$TAG"

      # ==========================================
      # 13. 自动创建 GitHub Release
      # ==========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Relaxin ${{ env.TAG }}

          body: |
            # Relaxin TIPA

            自动构建版本。

            **Repository**

            ${{ github.repository }}

            **Commit**

            ${{ github.sha }}

            **Build**

            #${{ github.run_number }}

            **Package**

            Relaxin.tipa

          files: |
            release/Relaxin.tipa

          draft: false
          prerelease: false

      # ==========================================
      # 14. 保存构建日志
      # ==========================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-build-log
          path: build.log
          if-no-files-found: ignore