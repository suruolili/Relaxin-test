name: Build Relaxin TIPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

    - name: Checkout source
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        echo "===== Installing dependencies ====="

        brew update

        brew update

        brew install make

        brew install ldid

        echo "===== Compiler ====="
        clang --version

        echo "===== Make ====="
        make --version

        echo "===== ldid ====="
        ldid -h

    - name: Check source tree
      run: |
        echo "===== Source tree ====="

        ls -la

        find . -iname "*trustcache*" -type f


    #
    # Build trustcache tool
    #
    - name: Build trustcache
      run: |
        echo "===== Building trustcache ====="

        mkdir -p Tools


        if [ -d Tools/trustcache ]; then
          cd Tools/trustcache

          if [ -f Makefile ]; then
            make
          fi

          cd ../..
        fi


        if [ -f Tools/trustcache ]; then
          chmod +x Tools/trustcache
          echo "trustcache OK"
        else
          echo "ERROR: trustcache was not generated"
          exit 1
        fi


    #
    # Build Dopamine BaseBin
    #
    - name: Build BaseBin
      run: |
        echo "===== Building BaseBin ====="

        cd Vendor/Dopamine/BaseBin

        if [ -f Makefile ]; then
          make
        else
          echo "BaseBin Makefile missing"
          exit 1
        fi

        cd ../../..



    #
    # Build TIPA
    #
    - name: Build TIPA
      run: |
        echo "===== Building TIPA ====="

        chmod +x DevKit/Helpers/check-tools.sh || true

        make tipa



    #
    # Collect output
    #
    - name: Find generated files
      run: |
        echo "===== Output files ====="

        find . \
        -type f \
        \( -name "*.tipa" -o -name "*.ipa" \)



    - name: Upload TIPA
      uses: actions/upload-artifact@v4
      with:
        name: Relaxin-TIPA
        path: |
          **/*.tipa
          **/*.ipa
        if-no-files-found: error
