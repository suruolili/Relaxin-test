name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1


    steps:


      # =========================
      # Checkout
      # =========================

      - name: Checkout
        uses: actions/checkout@v4



      # =========================
      # Install dependencies
      # =========================

      - name: Install build tools
        run: |

          echo "===== PATH ====="
          echo $PATH


          brew install \
            ldid \
            dpkg \
            ripgrep \
            fakeroot \
            coreutils \
            gnu-tar \
            binutils



          echo "/opt/homebrew/opt/binutils/bin" >> $GITHUB_PATH

          echo "/opt/homebrew/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH



          echo "===== Check tools ====="


          which ldid

          which dpkg-deb

          which rg

          which fakeroot

          which ar

          which tar





      # =========================
      # Build trustcache
      # =========================

            # =========================
      # Install trustcache
      # =========================

      - name: Install trustcache
        run: |

          echo "Searching existing trustcache"


          find . -name trustcache -type f || true



          if [ -f "./trustcache" ]; then

              echo "Found local trustcache"


              chmod +x ./trustcache


              sudo install \
              -m 755 \
              ./trustcache \
              /usr/local/bin/trustcache


          else

              echo "Downloading trustcache from Procursus packages"


              curl -L \
              https://apt.procurs.us/bootstrapped/usr/bin/trustcache \
              -o trustcache || true



              if [ -f trustcache ]; then

                  chmod +x trustcache


                  sudo install \
                  -m 755 \
                  trustcache \
                  /usr/local/bin/trustcache

              fi

          fi



          echo "===== Check trustcache ====="


          which trustcache || true


          echo "===== Building trustcache ====="


          rm -rf /tmp/trustcache



          git clone \
          https://github.com/ProcursusTeam/trustcache.git \
          /tmp/trustcache



          cd /tmp/trustcache



          echo "===== trustcache source ====="

          ls -la



          make



          echo "===== install ====="


          sudo install \
          -m 755 \
          trustcache \
          /usr/local/bin/trustcache



          echo "===== Verify ====="


          which trustcache


          trustcache --help || true





      # =========================
      # Fix permissions
      # =========================

      - name: Fix permissions
        run: |


          find DevKit \
          -name "*.sh" \
          -exec chmod +x {} \;



          chmod +x DevKit/Helpers/*.sh || true



          echo "===== Helpers ====="


          ls -la DevKit/Helpers





      # =========================
      # Verify environment
      # =========================

      - name: Verify environment
        run: |


          echo "===== PATH ====="

          echo $PATH



          echo "===== Required tools ====="



          which ldid

          which dpkg-deb

          which rg

          which trustcache



          trustcache --help || true



          dpkg-deb --version





      # =========================
      # Debug BaseBin
      # =========================

      - name: Debug BaseBin
        run: |


          echo "===== BaseBin ====="



          find . \
          \( \
          -iname "*basebin*" \
          -o \
          -iname "*trustcache*" \
          \)



          echo "===== trustcache reference ====="



          grep -R "trustcache" . || true





      # =========================
      # Build
      # =========================

      - name: Build Relaxin TIPA
        run: |


          set -o pipefail


          export V=1

          export VERBOSE=1



          make tipa V=1 VERBOSE=1 2>&1 | tee build.log





      # =========================
      # Upload log
      # =========================

      - name: Upload build log
        if: always()

        uses: actions/upload-artifact@v4


        with:

          name: Relaxin-build-log

          path: build.log





      # =========================
      # Find tipa
      # =========================

      - name: Find TIPA
        if: always()

        run: |

          find . -name "*.tipa" || true





      # =========================
      # Upload tipa
      # =========================

      - name: Upload TIPA
        if: success()

        uses: actions/upload-artifact@v4


        with:

          name: Relaxin-tipa

          path: |

            **/*.tipa
