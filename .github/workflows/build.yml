name: Build Relaxin TIPA


on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: macos-14


    steps:


    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive



    - name: Install dependencies
      run: |

        brew install \
          ldid \
          ripgrep \
          jq \
          yq


        echo "===== Tools ====="

        clang --version
        rg --version
        jq --version
        yq --version
        ldid -h



    - name: Prepare scripts
      run: |

        find . \
        -name "*.sh" \
        -exec chmod +x {} \;



    - name: Check project
      run: |

        echo "===== Tree ====="

        ls


        echo "===== Xcode ====="

        ls -la Application || true

        find . \
        -name "*.xcodeproj"



    #
    # Build everything
    #

    - name: Build Dopamine style
      run: |

        echo "===== Building Relaxin ====="


        make \
        MIN_IOS_VERSION=15.0



    #
    # Find TIPA
    #

    - name: Find TIPA
      run: |

        find . \
        -name "*.tipa" \
        -o \
        -name "*.ipa"



    - name: Upload
      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-TIPA

        path:

          |
          **/*.tipa
          **/*.ipa
