name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1


    steps:


      # =========================
      # Checkout
      # =========================

      - name: Checkout
        uses: actions/checkout@v4



      # =========================
      # Install dependencies
      # =========================

      - name: Install build tools
        run: |

          echo "===== Install tools ====="


          brew install \
            ldid \
            dpkg \
            ripgrep \
            fakeroot \
            coreutils \
            gnu-tar \
            binutils



          echo "/opt/homebrew/opt/binutils/bin" >> $GITHUB_PATH

          echo "/opt/homebrew/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH



          echo "===== Verify tools ====="


          which ldid

          which dpkg-deb

          which rg

          which fakeroot

          which ar

          which tar





      # =========================
      # Install trustcache
      # =========================

      - name: Install trustcache
        run: |


          echo "===== Searching trustcache ====="



          find . \
          -name trustcache \
          -type f \
          || true



          if [ -f "./trustcache" ]; then


              echo "Using local trustcache"


              chmod +x ./trustcache


              sudo install \
              -m 755 \
              ./trustcache \
              /usr/local/bin/trustcache



          else


              echo "Downloading trustcache"



              curl -fL \
              https://apt.procurs.us/bootstrapped/usr/bin/trustcache \
              -o trustcache



              chmod +x trustcache



              sudo install \
              -m 755 \
              trustcache \
              /usr/local/bin/trustcache



          fi



          echo "===== trustcache check ====="



          which trustcache


          trustcache --help || true





      # =========================
      # Fix permissions
      # =========================

      - name: Fix permissions
        run: |


          echo "===== Fix scripts ====="



          find DevKit \
          -name "*.sh" \
          -exec chmod +x {} \;



          chmod +x DevKit/Helpers/*.sh || true



          ls -la DevKit/Helpers





      # =========================
      # Environment check
      # =========================

      - name: Verify environment
        run: |


          echo "===== PATH ====="

          echo $PATH



          echo "===== Tools ====="



          which ldid


          which dpkg-deb


          which rg


          which trustcache



          ldid -h || true


          dpkg-deb --version


          trustcache --help || true





      # =========================
      # Debug BaseBin
      # =========================

      - name: Debug BaseBin
        run: |


          echo "===== BaseBin files ====="



          find . \
          \( \
          -iname "*basebin*" \
          -o \
          -iname "*trustcache*" \
          \)



          echo "===== trustcache reference ====="



          grep -R "trustcache" . || true





      # =========================
      # Build
      # =========================

      - name: Build Relaxin TIPA
        run: |


          set -o pipefail



          export V=1

          export VERBOSE=1



          make tipa V=1 VERBOSE=1 2>&1 | tee build.log





      # =========================
      # Upload log
      # =========================

      - name: Upload build log
        if: always()

        uses: actions/upload-artifact@v4


        with:


          name: Relaxin-build-log


          path: build.log





      # =========================
      # Find tipa
      # =========================

      - name: Find TIPA
        if: always()

        run: |


          find . -name "*.tipa" || true





      # =========================
      # Upload tipa
      # =========================

      - name: Upload TIPA
        if: success()

        uses: actions/upload-artifact@v4


        with:


          name: Relaxin-tipa


          path: |
            **/*.tipa
