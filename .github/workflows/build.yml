name: Build Relaxin TIPA

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:

    runs-on: macos-14

    steps:

    - name: Checkout source
      uses: actions/checkout@v4


    - name: Fix brew lock
      run: |
        rm -f /opt/homebrew/var/homebrew/locks/*
        rm -f /usr/local/var/homebrew/locks/*


    - name: Install dependencies
      run: |
        echo "===== Installing dependencies ====="

        brew install make ldid || true

        echo "===== Compiler ====="
        clang --version

        echo "===== Make ====="
        make --version

        echo "===== ldid ====="
        ldid -h


    - name: Check source tree
      run: |
        echo "===== Source tree ====="

        ls -la

        echo "===== Trustcache sources ====="

        find . -iname "*trustcache*" -type f || true



    #
    # Build Dopamine BaseBin
    #

    - name: Check BaseBin
      run: |
        echo "===== Checking BaseBin ====="

        ls -la Vendor/Dopamine/BaseBin

        find Vendor/Dopamine/BaseBin \
        -iname "*trustcache*" \
        -type f || true



    - name: Build BaseBin
      run: |
        echo "===== Building BaseBin ====="

        cd Vendor/Dopamine/BaseBin

        if [ -f Makefile ]; then

          make

        else

          echo "ERROR: BaseBin Makefile missing"
          exit 1

        fi

        cd ../../..



    #
    # Build Relaxin TIPA
    #

    - name: Build TIPA
      run: |
        echo "===== Building TIPA ====="

        chmod +x DevKit/Helpers/check-tools.sh || true

        make tipa



    #
    # Find output
    #

    - name: Find generated files
      run: |
        echo "===== Output files ====="

        find . \
        -type f \
        \( \
        -name "*.tipa" \
        -o \
        -name "*.ipa" \
        \)



    #
    # Upload
    #

    - name: Upload TIPA
      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-TIPA

        path: |

          **/*.tipa
          **/*.ipa

        if-no-files-found: error
