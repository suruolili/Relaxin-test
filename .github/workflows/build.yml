name: Build Relaxin TIPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - uses: actions/checkout@v4

    - name: Fix brew lock
      run: |
       rm -f /opt/homebrew/var/homebrew/locks/*
       rm -f /usr/local/var/homebrew/locks/*
    - name: Install dependencies
      run: |
        echo "===== Installing dependencies ====="

        # GitHub macOS runner 已经预装 Homebrew
        # 不强制 brew update，避免锁冲突

         brew install make ldid

         echo "===== Versions ====="

         make --version
         clang --version
         ldid -h

        echo "===== Compiler ====="
        clang --version

        echo "===== Make ====="
        make --version

        echo "===== ldid ====="
        ldid -h

    - name: Check source tree
      run: |
        echo "===== Source tree ====="

        ls -la

        find . -iname "*trustcache*" -type f


    #
    # Build trustcache tool
    #
    - name: Check trustcache files
      run: |
        echo "===== Searching trustcache ====="
        find . -iname "*trustcache*" -type f
        echo "===== Tools directory ====="
        ls -la Tools || true
    - name: Build trustcache
      run: |
        echo "===== Building trustcache ====="

        mkdir -p Tools

        cd Tools/trustcache

        make

        chmod +x trustcache

        cd ../..
 
        cp Tools/trustcache/trustcache Tools/trustcache

          chmod +x Tools/trustcache

        if [ -x Tools/trustcache ]; then
          echo "trustcache OK"
        else
          echo "ERROR: trustcache was not generated"
          exit 1
        fi


    #
    # Build Dopamine BaseBin
    #
    - name: Build BaseBin
      run: |
        echo "===== Building BaseBin ====="

        cd Vendor/Dopamine/BaseBin

        if [ -f Makefile ]; then
          make
        else
          echo "BaseBin Makefile missing"
          exit 1
        fi

        cd ../../..



    #
    # Build TIPA
    #
    - name: Build TIPA
      run: |
        echo "===== Building TIPA ====="

        chmod +x DevKit/Helpers/check-tools.sh || true

        make tipa



    #
    # Collect output
    #
    - name: Find generated files
      run: |
        echo "===== Output files ====="

        find . \
        -type f \
        \( -name "*.tipa" -o -name "*.ipa" \)



    - name: Upload TIPA
      uses: actions/upload-artifact@v4
      with:
        name: Relaxin-TIPA
        path: |
          **/*.tipa
          **/*.ipa
        if-no-files-found: error
