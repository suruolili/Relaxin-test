name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main



jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1



    steps:


    # ======================
    # Checkout
    # ======================

    - name: Checkout
      uses: actions/checkout@v4



    # ======================
    # Install tools
    # ======================

    - name: Install build tools
      run: |

        echo "===== Current PATH ====="
        echo $PATH


        brew install \
          ldid \
          dpkg \
          ripgrep \
          fakeroot \
          coreutils \
          gnu-tar \
          binutils



        echo "===== Add GNU tools ====="


        echo "/opt/homebrew/opt/binutils/bin" >> $GITHUB_PATH

        echo "/opt/homebrew/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH



        echo "===== Verify tools ====="


        which curl
        which ldid
        which dpkg-deb
        which rg
        which fakeroot
        which ar
        which tar





    # ======================
    # Install trustcache
    # ======================

    - name="Install trustcache"
      run: |

        echo "Installing trustcache"


        echo "PATH=$PATH"


        which curl



        curl -fL \
        https://github.com/opa334/trollstore-tools/releases/latest/download/trustcache \
        -o trustcache



        echo "===== File check ====="


        file trustcache



        chmod +x trustcache



        sudo install \
        -m 755 \
        trustcache \
        /usr/local/bin/trustcache



        echo "===== trustcache ====="


        which trustcache


        trustcache --help || true





    # ======================
    # Fix permissions
    # ======================

    - name="Fix permissions"
      run: |


        find DevKit \
        -name "*.sh" \
        -exec chmod +x {} \;


        chmod +x DevKit/Helpers/*.sh || true


        echo "===== Helpers ====="


        ls -la DevKit/Helpers





    # ======================
    # Environment check
    # ======================

    - name="Verify environment"
      run: |


        echo "===== PATH ====="

        echo $PATH



        echo "===== Tools ====="


        which curl
        which ldid
        which dpkg-deb
        which rg
        which trustcache



        ar --version || true

        tar --version || true





    # ======================
    # Debug BaseBin
    # ======================

    - name="Debug BaseBin"
      run: |


        echo "===== Search BaseBin ====="


        find . \
        \( -iname "*basebin*" -o -iname "*trustcache*" \)



        echo "===== Search scripts ====="


        grep -R "trustcache" . || true



        echo "===== Archive tools ====="


        which ar

        which ranlib

        which tar





    # ======================
    # Build
    # ======================

    - name="Build Relaxin TIPA"
      run: |


        set -o pipefail


        export V=1

        export VERBOSE=1



        make tipa V=1 VERBOSE=1 2>&1 | tee build.log





    # ======================
    # Upload log
    # ======================

    - name="Upload build log"
      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-build-log

        path: build.log





    # ======================
    # Find TIPA
    # ======================

    - name="Find TIPA"
      if: always()

      run: |

        find . -name "*.tipa" || true





    # ======================
    # Upload TIPA
    # ======================

    - name="Upload TIPA"
      if: success()

      uses: actions/upload-artifact@v4


      with:

        name: Relaxin-tipa

        path:

          **/*.tipa
