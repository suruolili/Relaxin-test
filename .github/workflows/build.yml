name: Build Relaxin TIPA

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:
  build:

    runs-on: macos-14


    steps:

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive
  


    - name: Install dependencies
      run: |
        echo "===== Installing dependencies ====="

        brew install make ldid ripgrep || true

        echo "===== Versions ====="

        clang --version
        make --version
        rg --version
        ldid -h



    - name: Prepare build environment
      run: |
        echo "===== Prepare ====="

        find . -name "*.sh" -exec chmod +x {} \;

        chmod +x DevKit/Helpers/check-tools.sh || true



    - name: Check BaseBin
      run: |
        echo "===== Checking BaseBin ====="

        ls -la Vendor/Dopamine/BaseBin

        echo "===== Makefile ====="

        head -50 Vendor/Dopamine/BaseBin/Makefile






    #
    # Build Relaxin
    #

    - name: Check Xcode project
      run: |
        echo "===== Checking project ====="

        ls -la

        if [ ! -f Relaxin.xcodeproj/project.pbxproj ]; then
           echo "ERROR: project.pbxproj missing"
           exit 1
        fi

        echo "Xcode project OK"
    - name: Build TIPA
      run: |
        echo "===== Building TIPA ====="

        chmod +x DevKit/Helpers/check-tools.sh || true

        make \
        MIN_IOS_VERSION=15.0 \
        SIGNATURE_VERIFIER_SOURCE=Vendor/Dopamine/BaseBin/launchdhook/src/signed_trustcache_restore.c \
        tipa



    #
    # Find output
    #

    - name: Find generated files
      run: |
        echo "===== Output ====="

        find . \
        -type f \
        \( \
        -name "*.tipa" \
        -o \
        -name "*.ipa" \
        \)



    #
    # Upload
    #

    - name: Upload TIPA
      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-TIPA

        path: |
          **/*.tipa
          **/*.ipa

        if-no-files-found: error
