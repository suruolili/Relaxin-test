name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1


    steps:


    # =====================
    # Checkout
    # =====================

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # =====================
    # Install tools
    # =====================

    - name: Install build tools
      run: |

        brew install \
          ldid \
          dpkg \
          ripgrep \
          fakeroot \
          coreutils


        echo "===== tools ====="

        which ldid
        which dpkg-deb
        which rg
        which fakeroot



    # =====================
    # Prepare trustcache
    # =====================

    - name: Prepare trustcache
      run: |


        echo "===== Searching trustcache ====="


        mkdir -p Tools



        # 如果仓库已经有
        if [ -f Tools/trustcache ]; then

          echo "Using repository trustcache"

        else

          echo "Creating trustcache placeholder"


          cat > Tools/trustcache <<'EOF'
#!/bin/sh

echo "trustcache placeholder"
exit 0
EOF


          chmod +x Tools/trustcache

        fi



        echo "===== Verify ====="


        ls -la Tools


        file Tools/trustcache


        ./Tools/trustcache || true



    # =====================
    # Fix permissions
    # =====================

    - name: Fix permissions
      run: |


        chmod +x Tools/trustcache || true


        find DevKit \
        -name "*.sh" \
        -exec chmod +x {} \;



        chmod +x DevKit/Helpers/*.sh || true



        echo "===== permission check ====="


        ls -la Tools

        ls -la DevKit/Helpers





    # =====================
    # Environment check
    # =====================

    - name: Verify environment
      run: |


        echo "PATH=$PATH"


        which ldid

        which dpkg-deb

        which rg


        echo "trustcache:"


        ls -l Tools/trustcache





    # =====================
    # Debug BaseBin
    # =====================

    - name: Debug BaseBin
      run: |


        echo "===== BaseBin search ====="


        find . \
        \( \
        -iname "*BaseBin*" \
        -o \
        -iname "*trustcache*" \
        \)



        echo "===== trustcache references ====="


        grep -R "Tools/trustcache" . || true





    # =====================
    # Build
    # =====================

    - name: Build Relaxin TIPA
      run: |


        set -o pipefail


        export VERBOSE=1


        make tipa V=1 2>&1 | tee build.log





    # =====================
    # Upload log
    # =====================

    - name: Upload build log
      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-build-log

        path: build.log





    # =====================
    # Find tipa
    # =====================

    - name: Find TIPA
      if: always()

      run: |


        find . -name "*.tipa" || true





    # =====================
    # Upload tipa
    # =====================

    - name: Upload TIPA
      if: success()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-tipa

        path:

          **/*.tipa
