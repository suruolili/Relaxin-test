name: Build & Release Relaxin TIPA

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Relaxin TIPA
    runs-on: macos-14

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. Environment
      # =========================
      - name: Show environment
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Swift:"
          swift --version

      # =========================
      # 3. Install dependencies
      # =========================
      - name: Install dependencies
        run: |
          brew update

          brew install ldid || true
          brew install xz || true
          brew install zstd || true

      # =========================
      # 4. Prepare scripts
      # =========================
      - name: Prepare build scripts
        run: |
          chmod +x mybuild.sh || true
          chmod +x .env.sh || true

          echo "Makefile:"
          ls -la Makefile

          echo "Build script:"
          ls -la mybuild.sh || true

      # =========================
      # 5. Clean
      # =========================
      - name: Clean previous build
        run: |
          make clean || true

      # =========================
      # 6. Build TIPA
      # =========================
      - name: Build TIPA
        run: |
          set -o pipefail

          make tipa 2>&1 | tee build.log

      # =========================
      # 7. Find TIPA
      # =========================
      - name: Locate TIPA
        id: find_tipa
        shell: bash
        run: |
          echo "Searching for TIPA..."

          find . \
            -type f \
            \( -name "*.tipa" -o -name "*.TIPA" \) \
            -print

          TIPA=$(find . \
            -type f \
            \( -name "*.tipa" -o -name "*.TIPA" \) \
            -print -quit)

          if [ -z "$TIPA" ]; then
            echo "ERROR: No TIPA file found!"
            echo ""
            echo "===== Build log ====="
            cat build.log || true
            exit 1
          fi

          echo "Found:"
          echo "$TIPA"

          echo "tipa=$TIPA" >> "$GITHUB_OUTPUT"

      # =========================
      # 8. Rename artifact
      # =========================
      - name: Prepare release file
        id: release
        shell: bash
        run: |
          mkdir -p release

          VERSION="build-${GITHUB_RUN_NUMBER}"
          OUTPUT="release/Relaxin-${VERSION}.tipa"

          cp "${{ steps.find_tipa.outputs.tipa }}" "$OUTPUT"

          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Release file:"
          ls -lh "$OUTPUT"

      # =========================
      # 9. Upload Actions artifact
      # =========================
      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-TIPA
          path: release/*.tipa
          if-no-files-found: error

      # =========================
      # 10. Generate release tag
      # =========================
      - name: Generate release tag
        id: tag
        shell: bash
        run: |
          TAG="v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Release tag:"
          echo "$TAG"

      # =========================
      # 11. Create GitHub Release
      # =========================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Relaxin ${{ steps.tag.outputs.tag }}
          body: |
            ## Relaxin TIPA

            Automated build from commit:

            `${{ github.sha }}`

            ### Build information

            - Repository: `${{ github.repository }}`
            - Branch: `${{ github.ref_name }}`
            - Build: `#${{ github.run_number }}`
            - macOS: macos-14
            - Package: TIPA

            This release was automatically generated by GitHub Actions.
          files: |
            release/*.tipa
          draft: false
          prerelease: false

      # =========================
      # 12. Upload build log
      # =========================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-build-log
          path: build.log
          if-no-files-found: ignore