name: Build Relaxin TIPA


on:

  push:
    branches:
      - main

  workflow_dispatch:



jobs:

  build:

    runs-on: macos-14


    steps:


    # -----------------------------
    # Checkout
    # -----------------------------

    - name: Checkout source

      uses: actions/checkout@v4

      with:

        submodules: recursive
        fetch-depth: 0



    # -----------------------------
    # Dependencies
    # -----------------------------

    - name: Install dependencies

      run: |

        echo "===== Installing dependencies ====="


        brew install \
          ldid \
          ripgrep \
          jq \
          yq



        echo "===== Versions ====="


        clang --version

        rg --version

        jq --version

        yq --version

        ldid -h



    # -----------------------------
    # Prepare
    # -----------------------------

    - name: Prepare scripts

      run: |

        echo "===== Preparing scripts ====="


        find . \
        -name "*.sh" \
        -exec chmod +x {} \;



    # -----------------------------
    # Check Relaxin tree
    # -----------------------------

    - name: Check project

      run: |

        echo "===== Project ====="


        ls -la


        echo "===== Makefiles ====="


        find . \
        -name Makefile \
        -maxdepth 3



        echo "===== Xcode projects ====="


        find . \
        -name "*.xcodeproj"



    # -----------------------------
    # Build
    # -----------------------------

    - name: Build Relaxin

      env:

        MIN_IOS_VERSION: "15.0"


      run: |

        echo "===== Building Relaxin ====="


        make tipa



    # -----------------------------
    # Output
    # -----------------------------

    - name: Find TIPA

      run: |

        echo "===== Searching output ====="


        find . \
        -type f \
        \( \
          -name "*.tipa" \
          -o \
          -name "*.ipa" \
        \)



    # -----------------------------
    # Upload
    # -----------------------------

    - name: Upload artifact

      uses: actions/upload-artifact@v4


      with:

        name: Relaxin-TIPA


        path: |

          **/*.tipa

          **/*.ipa


        if-no-files-found: error
