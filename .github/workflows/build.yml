name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      PATH: /usr/local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH


    steps:


    #################################
    # Checkout
    #################################

    - name: Checkout
      uses: actions/checkout@v4



    #################################
    # Tools
    #################################

    - name: Install tools
      run: |

        brew install \
          ldid \
          dpkg \
          ripgrep \
          fakeroot \
          coreutils


        echo "==== tools ===="

        which ldid
        which dpkg-deb
        which rg
        which fakeroot



    #################################
    # Install trustcache
    #################################

    - name: Setup trustcache
      run: |

        echo "==== Searching trustcache ===="


        if [ -f Tools/trustcache ]; then

          echo "Using repository trustcache"

          chmod +x Tools/trustcache

          sudo cp Tools/trustcache /usr/local/bin/trustcache


        else

          echo "No Tools/trustcache found"

          echo "Creating trustcache stub check"

          exit 1

        fi


        which trustcache

        trustcache --help || true




    #################################
    # Permissions
    #################################

    - name: Fix permissions
      run: |

        chmod +x DevKit/Helpers/*.sh || true


        find . \
        -name "*.sh" \
        -exec chmod +x {} \;



    #################################
    # Debug environment
    #################################

    - name: Debug environment
      run: |


        echo "PATH=$PATH"


        echo "==== commands ===="


        which ldid
        which dpkg-deb
        which trustcache


        echo "==== BaseBin ===="


        ls -la Vendor/Dopamine/BaseBin || true



    #################################
    # Build
    #################################

    - name: Build Relaxin
      continue-on-error: true
      run: |


        set -o pipefail


        make tipa \
        V=1 \
        VERBOSE=1 \
        2>&1 | tee build.log



    #################################
    # Extract BaseBin error
    #################################

    - name: Analyze BaseBin failure
      if: always()
      run: |


        echo "====== BaseBin errors ======"


        grep -n \
        -i \
        -E "error|failed|missing|not found" \
        build.log \
        || true



        echo "====== last 200 lines ======"


        tail -200 build.log



    #################################
    # Upload logs
    #################################

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4

      with:

        name: relaxin-build-log

        path:

          build.log




    #################################
    # Find tipa
    #################################

    - name: Find tipa
      if: always()
      run: |


        find . -name "*.tipa" || true




    #################################
    # Upload tipa
    #################################

    - name: Upload tipa
      if: success()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-tipa

        path: l

          **/*.tipa
