name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1


    steps:


    # =========================
    # Checkout
    # =========================

    - name: Checkout
      uses: actions/checkout@v4



    # =========================
    # Install dependencies
    # =========================

    - name: Install build tools
      run: |

        echo "===== Install tools ====="


        brew install \
          ldid \
          dpkg \
          ripgrep \
          fakeroot \
          coreutils \
          gnu-tar \
          binutils



        echo "/opt/homebrew/opt/binutils/bin" >> $GITHUB_PATH

        echo "/opt/homebrew/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH



        echo "===== Verify ====="


        which ldid

        which dpkg-deb

        which rg

        which fakeroot

        which ar

        which tar





    # =========================
    # Install trustcache
    # =========================

    - name: Install trustcache
      run: |

        echo "===== Searching trustcache ====="



        TRUSTCACHE=""



        if [ -f "Tools/trustcache" ]; then

            TRUSTCACHE="Tools/trustcache"

        fi



        if [ -z "$TRUSTCACHE" ]; then

            if command -v trustcache; then

                TRUSTCACHE=$(which trustcache)

            fi

        fi



        if [ -z "$TRUSTCACHE" ]; then

            echo "ERROR: trustcache not found"

            echo ""

            echo "Please add executable file:"

            echo "Tools/trustcache"

            echo ""

            find . -iname "*trustcache*" || true


            exit 1

        fi



        echo "Using trustcache:"

        echo "$TRUSTCACHE"



        chmod +x "$TRUSTCACHE"



        sudo install \
          -m 755 \
          "$TRUSTCACHE" \
          /usr/local/bin/trustcache



        echo "===== trustcache check ====="


        which trustcache


        trustcache --help || true





    # =========================
    # Fix permissions
    # =========================

    - name: Fix permissions
      run: |


        echo "===== chmod scripts ====="



        find DevKit \
          -name "*.sh" \
          -exec chmod +x {} \;



        chmod +x DevKit/Helpers/*.sh || true



        ls -la DevKit/Helpers





    # =========================
    # Environment check
    # =========================

    - name: Verify environment
      run: |


        echo "===== PATH ====="

        echo $PATH



        echo "===== Tools ====="



        which ldid

        which dpkg-deb

        which rg

        which trustcache



        trustcache --help || true





    # =========================
    # Debug BaseBin
    # =========================

    - name: Debug BaseBin
      run: |


        echo "===== Search BaseBin ====="



        find . \
        \( \
        -iname "*basebin*" \
        -o \
        -iname "*trustcache*" \
        \)



        echo "===== Search usage ====="



        grep -R "trustcache" . || true





    # =========================
    # Build TIPA
    # =========================

    - name: Build Relaxin TIPA
      run: |


        set -o pipefail



        export V=1

        export VERBOSE=1



        make tipa V=1 VERBOSE=1 2>&1 | tee build.log





    # =========================
    # Upload log
    # =========================

    - name: Upload build log
      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-build-log

        path: build.log





    # =========================
    # Find TIPA
    # =========================

    - name: Find TIPA
      if: always()

      run: |

        find . -name "*.tipa" || true





    # =========================
    # Upload TIPA
    # =========================

    - name: Upload TIPA
      if: success()

      uses: actions/upload-artifact@v4

      with:

        name: Relaxin-tipa

        path: |
          **/*.tipa
