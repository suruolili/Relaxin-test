name: Build Relaxin TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install build tools
      run: |
        brew install ldid dpkg ripgrep fakeroot coreutils

        echo "=== Check tools ==="

        which ldid
        which dpkg-deb
        which rg
        which fakeroot

        ldid -h || true
        dpkg-deb --version


    - name: Fix script permissions
      run: |
        chmod +x DevKit/Helpers/*.sh

        find DevKit -name "*.sh" -exec chmod +x {} \;

        ls -la DevKit/Helpers/


    - name: Build Relaxin TIPA
      run: |
        set -o pipefail
        make tipa 2>&1 | tee build.log


    - name: Find TIPA
      if: always()
      run: |
        echo "Searching tipa files..."
        find . -name "*.tipa" || true


    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Relaxin-build-log
        path: build.log


    - name: Upload TIPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Relaxin-tipa
        path: |
          **/*.tipa
