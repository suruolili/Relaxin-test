name: Build Relaxin TIPA


on:
  workflow_dispatch:
  push:
    branches:
      - main



jobs:

  build:

    runs-on: macos-latest


    env:
      HOMEBREW_NO_AUTO_UPDATE: 1



    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install build tools
      run: |

        brew install \
          ldid \
          dpkg \
          ripgrep \
          fakeroot \
          coreutils


        echo "==== basic tools ===="

        which ldid
        which dpkg-deb
        which rg



    #
    # Install trustcache
    #
    - name: Install trustcache
      run: |

        echo "Installing trustcache"


        brew install trustcache || true


        echo "Checking trustcache"


        if command -v trustcache
        then

          trustcache --help || true

        else

          echo "trustcache missing"

          exit 1

        fi



    - name: Fix permissions
      run: |

        find DevKit -name "*.sh" -exec chmod +x {} \;

        chmod +x DevKit/Helpers/*.sh || true



    - name: Verify environment
      run: |

        echo $PATH

        which ldid

        which dpkg-deb

        which trustcache



    - name: Build Relaxin TIPA
      run: |

        set -o pipefail

        make tipa 2>&1 | tee build.log



    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:

        name: Relaxin-build-log

        path: build.log



    - name: Upload TIPA
      if: success()
      uses: actions/upload-artifact@v4
      with:

        name: Relaxin-tipa

        path: |
          **/*.tipa
